name: E2E

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Also typechecks the dashboard, which the root tsconfig leaves to Next.
      - run: pnpm --filter @agent-ops/dashboard build

      - run: pnpm --filter @agent-ops/dashboard exec playwright install --with-deps chromium

      - run: pnpm --filter @agent-ops/dashboard e2e
        env:
          # The suite stubs the model; no key is read and no API is called.
          AGENT_OPS_TEST_PROVIDER: scripted

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7
